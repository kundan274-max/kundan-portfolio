<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Skills - Kundan Admin</title>
  </head>

  <body>
    <h1>🛠️ Manage Skills</h1>

    <p>
      <a href="{{ url_for('admin_dashboard') }}">📊 Dashboard</a>
      |
      <a href="{{ url_for('admin_profile') }}">👤 Profile</a>
      |
      <a href="{{ url_for('admin_logout') }}">🚪 Logout</a>
    </p>

    <hr />

    <h2>Add New Skill</h2>

    <form method="POST" action="{{ url_for('admin_skills') }}">
      <input
        type="text"
        name="skill_name"
        placeholder="Enter skill name"
        required
      />

      <button type="submit">➕ Add Skill</button>
    </form>

    <hr />

    <h2>Your Skills</h2>

    {% if skills %}
    <ul>
      {% for skill in skills %}
      <li>
        {{ skill["name"] }}

        <a href="{{ url_for('delete_skill', skill_id=skill['id']) }}">
          ❌ Delete
        </a>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p>No skills added yet.</p>
    {% endif %}
  </body>
</html>
